services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-bis_assistant}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # Persistent PostgreSQL data
      - pgdata:/var/lib/postgresql/data
      # Run this SQL when PostgreSQL initializes for the first time
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-bis_assistant}" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
